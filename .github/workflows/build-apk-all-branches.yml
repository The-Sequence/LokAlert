name: Build APKs for All Branches

on:
  # Allow manual trigger
  workflow_dispatch:
  # Trigger on push to any branch
  push:
    branches:
      - '**'

jobs:
  setup:
    name: Identify Branches to Build
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.get-branches.outputs.branches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get all branches
        id: get-branches
        run: |
          # Fetch all branches
          git fetch --all
          
          # Get all remote branches excluding HEAD, using a more robust approach
          branches=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v '^origin/HEAD$' | sed 's|^origin/||')
          
          # Convert to JSON array format using jq for safety
          branch_array=$(echo "$branches" | jq -R -s 'split("\n") | map(select(length > 0))')
          
          echo "branches=$branch_array" >> $GITHUB_OUTPUT
          echo "Found branches: $branch_array"

  build:
    name: Build APK for ${{ matrix.branch }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.setup.outputs.branches) }}
    
    steps:
      - name: Checkout branch ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      
      - name: Sign APK
        id: sign_apk
        run: |
          # Find the built APK (specifically the debug APK, not test APKs)
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -not -name "*-androidTest.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found"
            exit 1
          fi
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          
          # For debug builds, the APK is already signed with debug keystore
          # Rename it to include branch name for clarity
          BRANCH_SAFE=$(echo "${{ matrix.branch }}" | tr '/' '-')
          NEW_NAME="app/build/outputs/apk/debug/LokAlert-${BRANCH_SAFE}-debug.apk"
          mv "$APK_PATH" "$NEW_NAME"
          echo "signed_apk=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "branch_safe=$BRANCH_SAFE" >> $GITHUB_OUTPUT
          
          echo "APK signed and renamed to: $NEW_NAME"
      
      - name: Get version info
        id: version
        run: |
          # Extract version using Gradle properties task (more robust than regex)
          VERSION_NAME=$(./gradlew -q printVersionName 2>/dev/null || grep "versionName" app/build.gradle.kts | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' | head -n 1)
          VERSION_CODE=$(./gradlew -q printVersionCode 2>/dev/null || grep "versionCode" app/build.gradle.kts | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/' | head -n 1)
          
          # Fallback to default if extraction fails
          VERSION_NAME=${VERSION_NAME:-"1.0"}
          VERSION_CODE=${VERSION_CODE:-"1"}
          
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
      
      - name: Generate Release Notes
        id: release_notes
        run: |
          BRANCH="${{ matrix.branch }}"
          BRANCH_SAFE="${{ steps.sign_apk.outputs.branch_safe }}"
          VERSION="${{ steps.version.outputs.version_name }}"
          BUILD="${{ steps.version.outputs.version_code }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          # Create release notes file
          cat > release_notes.md << EOF
          # 📱 LokAlert APK - ${BRANCH} Branch
          
          **Version:** ${VERSION} (Build ${BUILD})
          **Branch:** ${BRANCH}
          **Build Date:** ${DATE}
          
          ## 📦 Installation
          
          1. Download the APK file below
          2. Enable "Install from Unknown Sources" on your Android device
          3. Install the APK
          4. Grant necessary permissions when prompted
          
          ## 🔍 Recent Changes
          
          EOF
          
          # Get recent commits for this branch (last 10)
          git log -10 --pretty=format:"- %s (%an, %ar)" >> release_notes.md
          
          cat >> release_notes.md << EOF
          
          ## ℹ️ About This Build
          
          This APK is built from the **${BRANCH}** branch and is signed with a debug certificate for testing purposes.
          
          **Application ID:** com.mobprog.lokalert
          **Package Name:** LokAlert-${BRANCH_SAFE}-debug.apk
          
          ## ⚠️ Note
          
          This is a debug build. For production use, a release build with proper signing should be used.
          EOF
          
          echo "Release notes generated"
          cat release_notes.md
      
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LokAlert-${{ steps.sign_apk.outputs.branch_safe }}-debug
          path: ${{ steps.sign_apk.outputs.signed_apk }}
          retention-days: 90
      
      - name: Get short SHA
        id: short_sha
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.sign_apk.outputs.branch_safe }}-v${{ steps.version.outputs.version_name }}-${{ steps.short_sha.outputs.short_sha }}
          name: LokAlert ${{ matrix.branch }} - v${{ steps.version.outputs.version_name }}
          body_path: release_notes.md
          files: ${{ steps.sign_apk.outputs.signed_apk }}
          draft: false
          prerelease: ${{ matrix.branch != 'main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        run: |
          echo "## ✅ Build Successful for ${{ matrix.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** ${{ steps.sign_apk.outputs.signed_apk }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ matrix.branch }}" >> $GITHUB_STEP_SUMMARY
