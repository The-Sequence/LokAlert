  <!-- 4. Grey Oval Shadow -->
  <ellipse cx="120" cy="154" rx="18" ry="6" fill="#B2B4B6" stroke="#000000" stroke-width="2"/>
  
  <!-- 5. Blue Map Pin -->
  <path d="M120,154 C120,154 138,130 138,116 A18,18 0 1,0 102,116 C102,130 120,154 120,154 Z" fill="#0C2245"/>
  
  <!-- 6. Red Dot inside Pin -->
