<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- White Background -->
  <rect width="240" height="240" fill="#FFFFFF"/>
  
  <!-- 1. Outer Blue Ring -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#345C86" stroke-width="18"/>
  
  <!-- 2. Red Sound Waves - Left -->
  <path d="M85,95 A45,45 0 0,0 85,145" fill="none" stroke="#EF1C25" stroke-width="10" stroke-linecap="round"/>
  <path d="M65,85 A65,65 0 0,0 65,155" fill="none" stroke="#EF1C25" stroke-width="10" stroke-linecap="round"/>
  
  <!-- 2. Red Sound Waves - Right -->
  <path d="M155,95 A45,45 0 0,1 155,145" fill="none" stroke="#EF1C25" stroke-width="10" stroke-linecap="round"/>
  <path d="M175,85 A65,65 0 0,1 175,155" fill="none" stroke="#EF1C25" stroke-width="10" stroke-linecap="round"/>
  
  <!-- 3. Bell Body - Top Knob -->
  <path d="M110,78 L130,78 A10,8 0 1,0 110,78 Z" fill="#EF1C25"/>
  
  <!-- 3. Bell Body - Main Shape -->
  <path d="M120,80 C135,80 148,95 152,125 C155,145 168,155 170,155 L170,162 L70,162 L70,155 C72,155 85,145 88,125 C92,95 105,80 120,80 Z" fill="#EF1C25"/>
  
  <!-- 3. Bell Body - Clapper -->
